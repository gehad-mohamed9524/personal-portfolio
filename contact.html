<!-- Main contact section -->
<article>
<h2>Contact Me</h2>
<!-- Contact form that opens an email application when submitted -->
<form action="mailto:gehad.mohamed@ontariotechu.net" method="post" enctype="text/plain" name="form">

<!-- Required field for the visitor's name -->
<p>
<label for="name">Name </label>
<input type="text" id="name" name="name" size="32" required>
</p>

<!-- Required field for the visitor's email address -->
<p>
<label for="email">Email</label>
<input id="email" name="email" type="email" size="40" required>
</p>

<!-- Required field for the visitor's phone number -->
<p>
<label for="phone">Phone Number</label>
<input type="number" id="phone" name="phone" required>
</p>

<!-- Text area for the visitor's message -->
<p>
<label for="comments">Comments</label>
<textarea id="comments" name="comments" rows="5" cols="40" required></textarea>
</p>

<!-- Button to submit the contact form -->
<p>
<input type="submit" value="Submit">
</p>

</form>

</article>

<!-- Footer with contact email and copyright information -->
<footer>

</footer>
